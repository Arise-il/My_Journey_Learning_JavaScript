<!DOCTYPE html>

    <script>
      let result = {};
      let noDub = [];
      function countWords(words){
        //check if the word in nodub if not add else skip, so there is no dublications in noDub
        for (let i = 0; i < words.length; i++){
          if (i === 0)
            noDub.push(words[i]);
          for (let j = 0; j < noDub.length; j++) {
            if (words[i] === noDub[j])
              break;
            else if (j === (noDub.length - 1))
              noDub.push(words[i]);
          }
        }
        //put nodub words in result
        for (let i = 0; i < noDub.length; i++){
          result[noDub[i]] = 0;
        }
        //calculate how many time the words in nodub are in words
        for (let j = 0; j < noDub.length; j++) {
          for (let i = 0; i < words.length; i++) {
            if (noDub[j] === words[i])
              result[noDub[j]]++;
          }
        }
      }
