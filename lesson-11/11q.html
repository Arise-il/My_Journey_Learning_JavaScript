<!DOCTYPE html>
<html>
  <head></head>
  <body>
    <script>
      function findIndex(array, search) {
        let result = -1;
        for(let i = 0; i < array.length; i++){
          if (array[i] === search){
            result = i;
            break;
          }
        }
        if (result !== -1)
          console.log(result);
        else
          console.log(-1);
      }

      findIndex(['green', 'red', 'blue', 'red', 'yellow'], 'red');
      findIndex(['red', 'blue'], 'yellow');
    </script>
  </body>
</html>
