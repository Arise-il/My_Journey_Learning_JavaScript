<!DOCTYPE html>
<html>

  </head>
  <body>
    <script>
      const addNumber = (array, num) => {
        let result = array.map((value) => {
          return value + num;
        });
        return result;
      }

      console.log(addNumber([1, 2, 3], 2));
      console.log(addNumber([-2, -1, 0, 11, 3], 2));
    </script>      
  </body>
</html>
