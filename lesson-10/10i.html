<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="10i.css">
  </head>
  <body>
    <p class="result">0</p>
    <p class="row">
      <button class="numbers" onclick="updateCalculation('1');">
        1
      </button>
      <button class="numbers" onclick="updateCalculation('2');">
        2
      </button>

      <button class="numbers" onclick="updateCalculation('3');">
        3
      </button>

      <button class="operators" onclick="updateCalculation(' + ');">
        +
      </button>
    </p>

    <p class="row">
      <button class="numbers" onclick="updateCalculation('4');">
        4
      </button>

      <button class="numbers" onclick="updateCalculation('5');">
        5
      </button>

      <button class="numbers" onclick="updateCalculation('6');">
        6
      </button>

      <button class="operators" onclick="updateCalculation(' - ');">
        -
      </button>
    </p>

    <p class="row">
      <button class="numbers" onclick="updateCalculation('7');">
        7
      </button>

      <button class="numbers" onclick="updateCalculation('8');">
        8
      </button>

      <button class="numbers" onclick="updateCalculation('9');">
        9
      </button>
      <button class="operators" onclick="updateCalculation(' * ');">
        *
      </button>
    </p>

    <p class="row">
      <button class="numbers" onclick="updateCalculation('0');">
        0
      </button>
      <button class="numbers" onclick="updateCalculation('.');">
        .
      </button> 
      <button class="numbers" onclick="equalButton();">
        =
      </button>
      <button class="operators" onclick="updateCalculation(' / ');">
        /
      </button>
    </p>

    <p class="row">
      <button class="clearButton" onclick="clearButton();">
        Clear
      </button>
    </p>

    <script src="10i.js"></script>
  </body>
</html>
