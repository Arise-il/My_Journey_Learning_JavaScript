<!DOCTYPE html>
<html>
  <head></head>
  <body>
    <p class="result">result = 0</p>
    <p>
    <button onclick="
      updateCalculation('1');
      ">
      1
    </button>

    <button onclick="
      updateCalculation('2');
      ">
      2
      </button>

    <button onclick="
      updateCalculation('3');
      ">
      3
    </button>
    </p>

    <p>
      <button onclick="
      updateCalculation('4');
      ">
      4
    </button>

    <button onclick="
      updateCalculation('5');
      ">
      5
      </button>

    <button onclick="
      updateCalculation('6');
      ">
      6
    </button>
    </p>

    <p>
      <button onclick="
      updateCalculation('7');
      ">
      7
    </button>

    <button onclick="
      updateCalculation('8');
      ">
      8
      </button>

    <button onclick="
      updateCalculation('9');
      ">
      9
    </button>
    </p>

    <p>
    <button onclick="
      updateCalculation(' + ');
      ">
      +
    </button>

    <button onclick="
      // Note: eval() takes a string and runs it as code.
      // Avoid using eval() in real world projects since
      // it can potentially be given harmful code to run.
      // Only use eval() for learning purposes.
      calculation = eval(calculation);
      localStorage.setItem('calculation', JSON.stringify(calculation));
      console.log(calculation);
      document.querySelector('.result').innerHTML = `Result = ${calculation}`;
      ">
      =
    </button>
    
    <button onclick="
      calculation = '';
      console.log(calculation);
      document.querySelector('.result').innerHTML = `Result = 0`;
      ">
      Clear
    </button> 
    </p>

    <script>
      let calculation = JSON.parse(localStorage.getItem('calculation'));
      if (!calculation)
        calculation = '';
      document.querySelector('.result').innerHTML = `Result = ${calculation}`;

      function updateCalculation(input) {
        calculation += input;
        localStorage.setItem('calculation', JSON.stringify(calculation));
        document.querySelector('.result').innerHTML = `Result = ${calculation}`;
        console.log(calculation);
      }
    </script>
  </body>
</html>
