<!DOCTYPE html>
<html>
  <head>
    <title>Document Object Model</title>
  </head>
  <body>
    <input class="js-input" type="text">
    <button onclick="
      printName();
    ">Submit</button>
    <p  class="done">Your name is : ??</p>


    <script>
      function printName()
      {
        let inputElement = document.querySelector('.js-input');
        let input = inputElement.value;

        document.querySelector('.done').innerText = `Your name is : ${input}`;
      }
    </script>
  </body>
</html>
